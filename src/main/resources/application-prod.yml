spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/approval_system?useSSL=true&requireSSL=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

# Production logging - minimal and structured
logging:
  level:
    root: WARN
    com.company.approval: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  file:
    name: /var/log/approval-system/application.log
    max-size: 10MB
    max-history: 30

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  compression:
    enabled: true
  http2:
    enabled: true

# Secure actuator in production
management:
  endpoints:
    web:
      exposure:
        include: health,info