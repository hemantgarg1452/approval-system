spring:
  datasource:
    url: jdbc:mysql://localhost:3306/approval_system_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:approval_user}
    password: ${DB_PASSWORD:approval_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Development-specific logging
logging:
  level:
    com.company.approval: DEBUG
    org.springframework.web: DEBUG
  file:
    name: logs/approval-system-dev.log

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param